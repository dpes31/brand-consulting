name: Apply Phase 6 Structured Contract Fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'fix/phase6-structured-report-renderer-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout active PR branch
        uses: actions/checkout@v4
        with:
          ref: fix/phase6-structured-report-renderer-v1
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply structured contract correction
        run: python scripts/apply-phase6-structured-contract-fix.py
      - name: Restore permanent workflow and remove temporary helpers
        shell: bash
        run: |
          git show ce4be65dbac43e44f0bf0afe07a09ac3aa3c638d:.github/workflows/phase6-v2-preview-e2e.yml > .github/workflows/phase6-v2-preview-e2e.yml
          rm -f .github/workflows/apply-phase6-external-json-fix.yml
          rm -f scripts/apply-phase6-structured-contract-fix.py
          rm -f phase6-apply-error.txt phase6-apply-error.log
      - name: Commit structured contract
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Phase 6 structured status contract"
          git push origin HEAD:fix/phase6-structured-report-renderer-v1
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run production build and contract tests
        run: npm run build
