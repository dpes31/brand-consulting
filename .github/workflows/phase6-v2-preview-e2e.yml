name: Phase 6 V2 Preview E2E

on:
  workflow_dispatch:
  push:
    branches:
      - fix-phase6-approved-full-renderer-v2
  pull_request:
    branches:
      - main

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PREVIEW_URL: https://brand-consulting-git-fix-phase6-approve-06a944-dpes31s-projects.vercel.app/
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install application dependencies
        run: npm install --no-audit --no-fund
      - name: Install Playwright
        run: |
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
      - name: Wait for Preview
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --show-error "$PREVIEW_URL" > /dev/null; then
              exit 0
            fi
            sleep 10
          done
          exit 1
      - name: Capture Preview entry
        run: node scripts/diagnose-phase6-preview.mjs
      - name: Run Phase 6 Preview E2E and preserve log
        shell: bash
        run: |
          mkdir -p phase6-v2-e2e-artifacts
          set +e
          node scripts/e2e-phase6-preview.mjs > phase6-v2-e2e-artifacts/e2e.log 2>&1
          code=$?
          echo "$code" > phase6-v2-e2e-artifacts/e2e.exit
          tail -n 160 phase6-v2-e2e-artifacts/e2e.log
          exit 0
      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase6-v2-preview-e2e-evidence
          path: phase6-v2-e2e-artifacts
      - name: Enforce E2E result
        shell: bash
        run: test "$(cat phase6-v2-e2e-artifacts/e2e.exit)" = "0"
