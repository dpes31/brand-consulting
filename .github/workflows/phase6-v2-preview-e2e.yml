name: Finalize Phase 6 External JSON Documentation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'fix/phase6-structured-report-renderer-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout active PR branch
        uses: actions/checkout@v4
        with:
          ref: fix/phase6-structured-report-renderer-v1
          fetch-depth: 0
      - name: Update required documentation
        run: python scripts/finalize-phase6-external-json-docs.py
      - name: Remove temporary updater and diagnostics
        shell: bash
        run: |
          rm -f scripts/finalize-phase6-external-json-docs.py
          rm -f phase6-apply-error.txt
      - name: Commit, rebase, and push documentation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize Phase 6 external JSON workflow documentation"
          git pull --rebase origin fix/phase6-structured-report-renderer-v1
          git push origin HEAD:fix/phase6-structured-report-renderer-v1
