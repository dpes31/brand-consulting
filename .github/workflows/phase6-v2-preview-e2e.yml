name: Apply Phase 6 External JSON Product Fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'fix/phase6-structured-report-renderer-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout active PR branch
        uses: actions/checkout@v4
        with:
          ref: fix/phase6-structured-report-renderer-v1
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Execute reviewed one-shot correction
        shell: bash
        run: |
          set +e
          python - <<'PYRUN' > phase6-apply-error.log 2>&1
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/apply-phase6-external-json-fix.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          script = textwrap.dedent(workflow[start:end])
          exec(compile(script, 'phase6-external-json-fix.py', 'exec'))
          PYRUN
          code=$?
          cat phase6-apply-error.log
          if [ "$code" != "0" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add phase6-apply-error.log
            git commit -m "Record Phase 6 correction failure"
            git push origin HEAD:fix/phase6-structured-report-renderer-v1
            exit "$code"
          fi
          git show HEAD^:.github/workflows/phase6-v2-preview-e2e.yml > .github/workflows/phase6-v2-preview-e2e.yml
          rm -f phase6-apply-error.log
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run production build and contract tests
        run: npm run build
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Phase 6 external AI JSON workflow [workflow-applied]"
          git push origin HEAD:fix/phase6-structured-report-renderer-v1
