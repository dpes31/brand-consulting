name: Phase 6 Main40 Semantic Renderer E2E

on:
  workflow_dispatch:
  push:
    branches:
      - fix/phase6-main40-semantic-renderer-v4
  pull_request:
    branches:
      - main

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      LOCAL_E2E_URL: http://127.0.0.1:4173/
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install application dependencies
        run: npm install --no-audit --no-fund
      - name: Install Playwright and PDF inspection tools
        run: |
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y poppler-utils
      - name: Build and run local Phase 6 E2E
        shell: bash
        run: |
          mkdir -p phase6-v2-e2e-artifacts
          set +e
          npm run build > phase6-v2-e2e-artifacts/local-build.log 2>&1
          build_code=$?
          if [ "$build_code" != "0" ]; then
            echo "$build_code" > phase6-v2-e2e-artifacts/local-e2e.exit
            tail -n 240 phase6-v2-e2e-artifacts/local-build.log
            exit 0
          fi
          npx vite preview --host 127.0.0.1 --port 4173 > phase6-v2-e2e-artifacts/local-server.log 2>&1 &
          server_pid=$!
          for attempt in {1..30}; do
            if curl --fail --silent --show-error "$LOCAL_E2E_URL" > /dev/null; then break; fi
            sleep 2
          done

          PREVIEW_URL="$LOCAL_E2E_URL" node scripts/e2e-material-symbols-first-paint-v2.mjs > phase6-v2-e2e-artifacts/material-symbols-e2e.log 2>&1
          icon_code=$?
          if [ "$icon_code" = "0" ]; then
            PREVIEW_URL="$LOCAL_E2E_URL" node scripts/e2e-phase6-pdf-button-routing.mjs > phase6-v2-e2e-artifacts/pdf-button-routing.log 2>&1
            routing_code=$?
          else
            routing_code=$icon_code
          fi
          if [ "$routing_code" = "0" ]; then
            PREVIEW_URL="$LOCAL_E2E_URL" node scripts/e2e-phase6-structured-renderer.mjs > phase6-v2-e2e-artifacts/structured-renderer-e2e.log 2>&1
            structured_code=$?
          else
            structured_code=$routing_code
          fi
          if [ "$structured_code" = "0" ]; then
            PREVIEW_URL="$LOCAL_E2E_URL" node scripts/e2e-phase6-html-sanitizer.mjs > phase6-v2-e2e-artifacts/html-sanitizer-e2e.log 2>&1
            code=$?
          else
            code=$structured_code
          fi

          kill "$server_pid" || true
          echo "$code" > phase6-v2-e2e-artifacts/local-e2e.exit
          tail -n 180 phase6-v2-e2e-artifacts/material-symbols-e2e.log
          if [ -f phase6-v2-e2e-artifacts/pdf-button-routing.log ]; then tail -n 240 phase6-v2-e2e-artifacts/pdf-button-routing.log; fi
          if [ -f phase6-v2-e2e-artifacts/structured-renderer-e2e.log ]; then tail -n 360 phase6-v2-e2e-artifacts/structured-renderer-e2e.log; fi
          if [ -f phase6-v2-e2e-artifacts/html-sanitizer-e2e.log ]; then tail -n 280 phase6-v2-e2e-artifacts/html-sanitizer-e2e.log; fi
          exit 0
      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase6-main40-semantic-renderer-evidence
          path: phase6-v2-e2e-artifacts
      - name: Enforce local E2E result
        run: test "$(cat phase6-v2-e2e-artifacts/local-e2e.exit)" = "0"
