name: Phase 6 Color and Native PDF E2E

on:
  workflow_dispatch:
  push:
    branches:
      - fix/phase6-report-color-consistency-v1
  pull_request:
    branches:
      - main

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      LOCAL_E2E_URL: http://127.0.0.1:4173/
      VERCEL_PREVIEW_URL: https://brand-consulting-git-fix-phase6-report-8cd75a-dpes31s-projects.vercel.app/
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install application dependencies
        run: npm install --no-audit --no-fund
      - name: Install Playwright and PDF inspection tools
        run: |
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y poppler-utils
      - name: Build and run local generated-report E2E
        shell: bash
        run: |
          mkdir -p phase6-v2-e2e-artifacts
          set +e
          npm run build > phase6-v2-e2e-artifacts/local-build.log 2>&1
          build_code=$?
          if [ "$build_code" != "0" ]; then
            echo "$build_code" > phase6-v2-e2e-artifacts/local-e2e.exit
            tail -n 180 phase6-v2-e2e-artifacts/local-build.log
            exit 0
          fi
          npx vite preview --host 127.0.0.1 --port 4173 > phase6-v2-e2e-artifacts/local-server.log 2>&1 &
          server_pid=$!
          for attempt in {1..30}; do
            if curl --fail --silent --show-error "$LOCAL_E2E_URL" > /dev/null; then
              break
            fi
            sleep 2
          done
          PREVIEW_URL="$LOCAL_E2E_URL" node scripts/e2e-phase6-color-native-print.mjs > phase6-v2-e2e-artifacts/local-e2e.log 2>&1
          code=$?
          kill "$server_pid" || true
          echo "$code" > phase6-v2-e2e-artifacts/local-e2e.exit
          tail -n 220 phase6-v2-e2e-artifacts/local-e2e.log
          exit 0
      - name: Enforce local E2E result
        run: test "$(cat phase6-v2-e2e-artifacts/local-e2e.exit)" = "0"
      - name: Wait for matching Vercel Preview commit
        run: PREVIEW_URL="$VERCEL_PREVIEW_URL" EXPECTED_SHA="$GITHUB_SHA" node scripts/wait-for-phase6-preview-commit.mjs
      - name: Run actual Vercel Preview generated-report E2E
        shell: bash
        run: |
          set +e
          PREVIEW_URL="$VERCEL_PREVIEW_URL" node scripts/e2e-phase6-color-native-print.mjs > phase6-v2-e2e-artifacts/preview-e2e.log 2>&1
          code=$?
          echo "$code" > phase6-v2-e2e-artifacts/preview-e2e.exit
          tail -n 240 phase6-v2-e2e-artifacts/preview-e2e.log
          exit 0
      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase6-color-native-pdf-evidence
          path: phase6-v2-e2e-artifacts
      - name: Enforce Vercel Preview E2E result
        run: test "$(cat phase6-v2-e2e-artifacts/preview-e2e.exit)" = "0"
