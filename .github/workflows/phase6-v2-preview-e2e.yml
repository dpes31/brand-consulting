name: Apply Phase 6 Structured Contract Fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'fix/phase6-structured-report-renderer-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout active PR branch
        uses: actions/checkout@v4
        with:
          ref: fix/phase6-structured-report-renderer-v1
          fetch-depth: 0
      - name: Apply structured contract correction
        run: python scripts/apply-phase6-structured-contract-fix.py
      - name: Commit and push structured contract
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/report/structuredReportV3.ts
          git commit -m "Add Phase 6 structured status contract"
          git push origin HEAD:fix/phase6-structured-report-renderer-v1
