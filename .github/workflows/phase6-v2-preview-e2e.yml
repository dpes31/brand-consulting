name: Repair Phase 6 Structured TypeScript

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'fix/phase6-structured-report-renderer-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout active PR branch
        uses: actions/checkout@v4
        with:
          ref: fix/phase6-structured-report-renderer-v1
          fetch-depth: 0
      - name: Repair newline literals
        run: python scripts/fix-phase6-structured-newlines.py
      - name: Restore permanent workflow and remove helper
        shell: bash
        run: |
          git show HEAD^:.github/workflows/phase6-v2-preview-e2e.yml > .github/workflows/phase6-v2-preview-e2e.yml
          rm -f scripts/fix-phase6-structured-newlines.py
      - name: Commit and push repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Phase 6 structured validation messages"
          git push origin HEAD:fix/phase6-structured-report-renderer-v1
