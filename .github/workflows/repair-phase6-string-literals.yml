name: Repair Phase 6 String Literals

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'fix/phase6-structured-report-renderer-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout active PR branch
        uses: actions/checkout@v4
        with:
          ref: fix/phase6-structured-report-renderer-v1
          fetch-depth: 0
      - name: Repair malformed string literals
        run: python scripts/repair-phase6-string-literals.py
      - name: Commit source repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/report/structuredReportV3.ts
          git commit -m "Fix Phase 6 structured validation string literals"
          git push origin HEAD:fix/phase6-structured-report-renderer-v1
