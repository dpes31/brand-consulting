name: Apply Phase 6 External JSON Fix

on:
  push:
    branches:
      - fix/phase6-structured-report-renderer-v1
    paths:
      - .github/workflows/apply-phase6-external-json-fix.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout active PR branch
        uses: actions/checkout@v4
        with:
          ref: fix/phase6-structured-report-renderer-v1
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply focused product correction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, value):
              Path(path).write_text(value, encoding='utf-8')

          def replace_once(path, old, new):
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement, found {count}')
              write(path, text.replace(old, new, 1))

          # 1) Creative History: AI-facing DATA contract only.
          path = 'src/lib/creativeHistoryContract.ts'
          old = '''export function buildCreativeHistoryCompilerDirective(rawData: string): string {
            const registry = parseCreativeHistoryRegistry(rawData);
            const currentYear = registry?.period.currentYearYtd ?? new Date().getFullYear();
            const years = expectedCreativeYears(currentYear);

            return `[CREATIVE HISTORY RENDERING CONTRACT]
          - Step 4의 CREATIVE_HISTORY_REGISTRY를 Creative History 페이지의 유일한 사실 원천으로 사용하십시오.
          - 조사 브랜드 slide-13과 각 competitor-creative-history 페이지는 정확히 ${years.length}개의 연도 카드(${years.join(', ')})를 가져야 합니다.
          - 각 페이지는 기존 .timeline-container / .timeline-card 컴포넌트를 사용하고, 각 카드에 data-year="연도"와 data-copy-status를 부여하십시오.
          - 각 연도 카드에는 연도, 캠페인명, 모델, 실제 카피 원문 또는 미확인 문구, 매체/포맷, 소구 전략을 포함하십시오.
          - verified-verbatim인 카피만 따옴표로 표시하십시오. source-found-copy-unverified와 not-found는 따옴표 없이 미확인 상태를 명시하십시오.
          - 현재연도에 캠페인이 없으면 '${currentYear} YTD 신규 캠페인 공개 미확인'을 사용하십시오.
          - 페이지 하단에는 Message Trajectory와 Strategic So What을 각각 분리해 표시하십시오.
          - URL은 노출하지 말고 evidenceLabel의 출처명·자료명·연도만 작은 근거 문구로 표시하십시오.
          - 한 브랜드의 6개년 카드를 다른 브랜드와 합치거나 브랜드별 페이지를 생략하지 마십시오.`;
          }
          '''
          new = '''export function buildCreativeHistoryDataDirective(rawData: string): string {
            const registry = parseCreativeHistoryRegistry(rawData);
            const currentYear = registry?.period.currentYearYtd ?? new Date().getFullYear();

            return `[CREATIVE HISTORY DATA CONTRACT]
          - Step 4의 CREATIVE_HISTORY_REGISTRY를 Creative History 페이지의 유일한 사실 원천으로 사용하십시오.
          - year1은 2021, year2는 2022, year3은 2023, year4는 2024, year5는 2025, year6은 2026 YTD를 의미합니다.
          - 각 *.status 값은 verified-verbatim, source-found-copy-unverified, not-found 중 정확히 하나만 반환하십시오.
          - status 값 안에 연도를 포함하지 마십시오. 예: "not-found"는 허용하지만 "2021 · not-found"는 허용하지 않습니다.
          - HTML, CSS, 클래스명, 속성명, 페이지 구조 또는 렌더링 구현 지시를 반환하지 마십시오.
          - 각 연도에는 캠페인명, 모델, 실제 카피 원문 또는 미확인 문구, 매체/포맷, 소구 전략을 해당 field key에만 기록하십시오.
          - verified-verbatim인 카피만 따옴표를 사용할 수 있습니다. source-found-copy-unverified와 not-found는 따옴표 없이 사실 상태만 기록하십시오.
          - 현재연도 캠페인이 확인되지 않으면 '${currentYear} YTD 신규 캠페인 공개 미확인'을 사용하십시오.
          - Message Trajectory와 Strategic So What은 지정된 별도 field에 각각 기록하십시오.
          - URL은 노출하지 말고 evidenceLabel의 출처명·자료명·연도만 기록하십시오.
          - 연도, 카드 순서, 상태별 표현과 따옴표 스타일은 애플리케이션 Renderer가 고정합니다.`;
          }

          export const buildCreativeHistoryCompilerDirective = buildCreativeHistoryDataDirective;
          '''
          replace_once(path, old, new)

          # 2) Structured schema metadata, constrained normalization and Korean errors.
          path = 'src/report/structuredReportV3.ts'
          replace_once(path, '''export type StructuredFieldDefinition = {
            key: string;
            page: number;
            pageId: string;
            hint: string;
            maxLength: number;
            kind: StructuredFieldKind;
          };''', '''export type StructuredFieldDefinition = {
            key: string;
            page: number;
            pageId: string;
            hint: string;
            maxLength: number;
            kind: StructuredFieldKind;
            enum?: string[];
            fixedYear?: number | '2026 YTD';
          };''')
          replace_once(path, '''const TEXT_CANDIDATE_SELECTOR = 'h1,h2,h3,h4,p,li,strong,b,span,small,blockquote,th,td,em';
          const ALLOWED_CREATIVE_STATUS = new Set(['verified-verbatim', 'source-found-copy-unverified', 'not-found']);''', '''export const CREATIVE_HISTORY_STATUS_VALUES = [
            'verified-verbatim',
            'source-found-copy-unverified',
            'not-found',
          ] as const;

          const TEXT_CANDIDATE_SELECTOR = 'h1,h2,h3,h4,p,li,strong,b,span,small,blockquote,th,td,em';
          const ALLOWED_CREATIVE_STATUS = new Set<string>(CREATIVE_HISTORY_STATUS_VALUES);''')
          replace_once(path, '''function registerField(
            element: Element | null,
            key: string,
            hint: string,
            maxLength = 160,
            kind: StructuredFieldKind = 'text',
          ): void {
            if (!element) return;
            if (element.hasAttribute('data-report-field')) return;
            element.setAttribute('data-report-field', key);
            element.setAttribute('data-report-hint', hint);
            element.setAttribute('data-report-max-length', String(maxLength));
            element.setAttribute('data-report-kind', kind);
          }''', '''function registerField(
            element: Element | null,
            key: string,
            hint: string,
            maxLength = 160,
            kind: StructuredFieldKind = 'text',
            metadata: Pick<StructuredFieldDefinition, 'enum' | 'fixedYear'> = {},
          ): void {
            if (!element) return;
            if (element.hasAttribute('data-report-field')) return;
            element.setAttribute('data-report-field', key);
            element.setAttribute('data-report-hint', hint);
            element.setAttribute('data-report-max-length', String(maxLength));
            element.setAttribute('data-report-kind', kind);
            if (metadata.enum?.length) element.setAttribute('data-report-enum', metadata.enum.join('|'));
            if (metadata.fixedYear !== undefined) element.setAttribute('data-report-fixed-year', String(metadata.fixedYear));
          }''')
          replace_once(path, '''function annotateHistory(slide: HTMLElement): void {
            registerField(slide.querySelector('.history-governing'), `${slide.id}.governing`, 'Creative History evidence rule', 130);
            Array.from(slide.querySelectorAll<HTMLElement>('.history-card')).forEach((card, index) => {
              markFixed(card.querySelector('h3'), String(2021 + index));
              registerField(card.querySelector('.history-status'), `${slide.id}.year${index + 1}.status`, `Creative History ${2021 + index} status`, 36, 'status');
              registerField(card.querySelector('h4'), `${slide.id}.year${index + 1}.campaign`, `Creative History ${2021 + index} campaign`, 70);
              registerField(card.querySelector('blockquote'), `${slide.id}.year${index + 1}.copy`, `Creative History ${2021 + index} verified copy or evidence-gap wording`, 130, 'rich');
              registerField(card.querySelector('.history-detail'), `${slide.id}.year${index + 1}.detail`, `Creative History ${2021 + index} model channel and meaning`, 120);
            });
            const bottoms = slide.querySelectorAll<HTMLElement>('.history-bottom > div');
            markFixed(bottoms[0]?.querySelector('span') || null, 'MESSAGE TRAJECTORY');
            registerField(bottoms[0]?.querySelector('strong') || null, `${slide.id}.trajectory`, 'six-year message trajectory', 200);
            markFixed(bottoms[1]?.querySelector('span') || null, 'STRATEGIC SO WHAT');
            registerField(bottoms[1]?.querySelector('strong') || null, `${slide.id}.strategicSoWhat`, 'Creative History strategic implication', 200, 'rich');
          }''', '''function annotateHistory(slide: HTMLElement): void {
            const fixedYears = [2021, 2022, 2023, 2024, 2025, '2026 YTD'] as const;
            registerField(slide.querySelector('.history-governing'), `${slide.id}.governing`, 'Creative History evidence rule', 130);
            Array.from(slide.querySelectorAll<HTMLElement>('.history-card')).forEach((card, index) => {
              const fixedYear = fixedYears[index];
              if (fixedYear === undefined) return;
              markFixed(card.querySelector('h3'), String(fixedYear));
              registerField(
                card.querySelector('.history-status'),
                `${slide.id}.year${index + 1}.status`,
                `Creative History ${fixedYear} status`,
                36,
                'status',
                { enum: [...CREATIVE_HISTORY_STATUS_VALUES], fixedYear },
              );
              registerField(card.querySelector('h4'), `${slide.id}.year${index + 1}.campaign`, `Creative History ${fixedYear} campaign`, 70);
              registerField(card.querySelector('blockquote'), `${slide.id}.year${index + 1}.copy`, `Creative History ${fixedYear} verified copy or evidence-gap wording`, 130, 'rich');
              registerField(card.querySelector('.history-detail'), `${slide.id}.year${index + 1}.detail`, `Creative History ${fixedYear} model channel and meaning`, 120);
            });
            const bottoms = slide.querySelectorAll<HTMLElement>('.history-bottom > div');
            markFixed(bottoms[0]?.querySelector('span') || null, 'MESSAGE TRAJECTORY');
            registerField(bottoms[0]?.querySelector('strong') || null, `${slide.id}.trajectory`, 'six-year message trajectory', 200);
            markFixed(bottoms[1]?.querySelector('span') || null, 'STRATEGIC SO WHAT');
            registerField(bottoms[1]?.querySelector('strong') || null, `${slide.id}.strategicSoWhat`, 'Creative History strategic implication', 200, 'rich');
          }''')
          replace_once(path, "documentRef.querySelectorAll('[data-report-field],[data-report-hint],[data-report-max-length],[data-report-kind],[data-report-fixed],[data-report-fixed-leading]').forEach((node) => {\n    ['data-report-field', 'data-report-hint', 'data-report-max-length', 'data-report-kind', 'data-report-fixed', 'data-report-fixed-leading'].forEach((name) => node.removeAttribute(name));", "documentRef.querySelectorAll('[data-report-field],[data-report-hint],[data-report-max-length],[data-report-kind],[data-report-enum],[data-report-fixed-year],[data-report-fixed],[data-report-fixed-leading]').forEach((node) => {\n    ['data-report-field', 'data-report-hint', 'data-report-max-length', 'data-report-kind', 'data-report-enum', 'data-report-fixed-year', 'data-report-fixed', 'data-report-fixed-leading'].forEach((name) => node.removeAttribute(name));")
          replace_once(path, '''    definitions.push({
                key: element.dataset.reportField || '',
                page: Number(slide.dataset.page),
                pageId: slide.id,
                hint: element.dataset.reportHint || '',
                maxLength: Number(element.dataset.reportMaxLength || 140),
                kind: (element.dataset.reportKind || 'text') as StructuredFieldKind,
              });''', '''    const enumValues = (element.dataset.reportEnum || '').split('|').filter(Boolean);
              const fixedYearRaw = element.dataset.reportFixedYear;
              let fixedYear: StructuredFieldDefinition['fixedYear'];
              if (fixedYearRaw === '2026 YTD') fixedYear = '2026 YTD';
              else if (fixedYearRaw && Number.isFinite(Number(fixedYearRaw))) fixedYear = Number(fixedYearRaw);
              definitions.push({
                key: element.dataset.reportField || '',
                page: Number(slide.dataset.page),
                pageId: slide.id,
                hint: element.dataset.reportHint || '',
                maxLength: Number(element.dataset.reportMaxLength || 140),
                kind: (element.dataset.reportKind || 'text') as StructuredFieldKind,
                ...(enumValues.length ? { enum: enumValues } : {}),
                ...(fixedYear !== undefined ? { fixedYear } : {}),
              });''')
          replace_once(path, "fields: pageDefinitions(definitions, id).map(({ key, hint, maxLength, kind }) => ({ key, hint, maxLength, kind })),", "fields: pageDefinitions(definitions, id).map(({ key, hint, maxLength, kind, enum: enumValues, fixedYear }) => ({\n      key, hint, maxLength, kind,\n      ...(enumValues?.length ? { enum: enumValues } : {}),\n      ...(fixedYear !== undefined ? { fixedYear } : {}),\n    })),")

          marker = 'function validatePersonaTitleConsistency(report: StructuredReportV3, errors: string[]): void {'
          insertion = '''export type StructuredNormalizationWarning = {
            page: number;
            pageId: string;
            pageTitle: string;
            fieldKey: string;
            fieldLabel: string;
            inputValue: string;
            normalizedValue: string;
            expectedValues: string[];
            autoRecovered: true;
          };

          const CREATIVE_HISTORY_PAGE_TITLES: Record<string, string> = {
            'creative-history-target': '타깃 브랜드 Creative History',
            'creative-history-1': '경쟁사 1 Creative History',
            'creative-history-2': '경쟁사 2 Creative History',
            'creative-history-3': '경쟁사 3 Creative History',
          };

          function pageTitleFor(page: StructuredReportPageV3 | undefined): string {
            if (!page) return '페이지 제목 미확인';
            return page.fields?.[`${page.id}.title`]?.trim()
              || CREATIVE_HISTORY_PAGE_TITLES[page.id]
              || page.id;
          }

          function statusFieldLabel(definition: StructuredFieldDefinition): string {
            return `${definition.fixedYear ?? '연도 미확인'} 상태`;
          }

          export function normalizeStructuredReportV3(
            report: StructuredReportV3,
            definitions: StructuredFieldDefinition[],
          ): { report: StructuredReportV3; warnings: StructuredNormalizationWarning[] } {
            const normalized = JSON.parse(JSON.stringify(report)) as StructuredReportV3;
            const warnings: StructuredNormalizationWarning[] = [];

            definitions.filter((definition) => definition.kind === 'status').forEach((definition) => {
              const page = normalized.pages?.[definition.page - 1];
              const value = page?.fields?.[definition.key];
              if (!page || typeof value !== 'string' || ALLOWED_CREATIVE_STATUS.has(value.trim())) return;
              const expectedValues = definition.enum?.length ? definition.enum : [...CREATIVE_HISTORY_STATUS_VALUES];
              const match = value.match(/^(.*?) · (verified-verbatim|source-found-copy-unverified|not-found)$/);
              if (!match || definition.fixedYear === undefined || match[1] !== String(definition.fixedYear)) return;
              const normalizedValue = match[2];
              if (!expectedValues.includes(normalizedValue)) return;
              page.fields[definition.key] = normalizedValue;
              warnings.push({
                page: definition.page,
                pageId: definition.pageId,
                pageTitle: pageTitleFor(page),
                fieldKey: definition.key,
                fieldLabel: statusFieldLabel(definition),
                inputValue: value,
                normalizedValue,
                expectedValues,
                autoRecovered: true,
              });
            });

            return { report: normalized, warnings };
          }

          export function formatStructuredNormalizationWarnings(warnings: StructuredNormalizationWarning[]): string {
            if (!warnings.length) return '';
            const details = warnings.map((warning) => [
              `P${warning.page} · ${warning.pageTitle}`,
              warning.fieldLabel,
              `입력값: “${warning.inputValue}”`,
              `예상값: “${warning.normalizedValue}”`,
              '처리: 앱이 연도 접두어를 제거하고 자동 정규화했습니다.',
            ].join('\\n')).join('\\n\\n');
            return `Creative History 입력 형식 ${warnings.length}건을 앱이 자동 정규화했습니다.\\n\\n${details}\\n\\n연도는 앱이 자동 배치하므로 상태 값에는 넣지 마세요.`;
          }

          '''
          text = read(path)
          if text.count(marker) != 1:
              raise SystemExit('structuredReportV3 normalization insertion marker mismatch')
          write(path, text.replace(marker, insertion + marker, 1))
          replace_once(path, "        if (definition.kind === 'status' && !ALLOWED_CREATIVE_STATUS.has(value.trim())) errors.push(`${definition.key} has invalid Creative History status`);", "        if (definition.kind === 'status') {\n          const expectedValues = definition.enum?.length ? definition.enum : [...CREATIVE_HISTORY_STATUS_VALUES];\n          if (!expectedValues.includes(value.trim())) {\n            errors.push([\n              `P${definition.page} · ${pageTitleFor(page)} · ${statusFieldLabel(definition)}`,\n              `입력값: “${value}”`,\n              `허용값:\\n${expectedValues.map((item) => `- ${item}`).join('\\n')}`,\n              '처리: 자동 복구할 수 없어 렌더링을 중단했습니다.',\n            ].join('\\n'));\n          }\n        }")

          # 3) External and internal paths use the same normalization contract.
          path = 'src/lib/geminiCompiler.ts'
          replace_once(path, "import { buildCreativeHistoryCompilerDirective } from './creativeHistoryContract';", "import { buildCreativeHistoryDataDirective } from './creativeHistoryContract';")
          replace_once(path, '''  buildStructuredReportPrompt,
            extractStructuredReportJson,
            prepareStructuredReportBase,
            renderStructuredReportV3,
          } from '../report/structuredReportV3';''', '''  buildStructuredReportPrompt,
            extractStructuredReportJson,
            normalizeStructuredReportV3,
            prepareStructuredReportBase,
            renderStructuredReportV3,
          } from '../report/structuredReportV3';''')
          replace_once(path, '    buildCreativeHistoryCompilerDirective(rawData),', '    buildCreativeHistoryDataDirective(rawData),')
          replace_once(path, '''  const report = extractStructuredReportJson(result.text);
            assertStructuredReportCrossPage(report);
            return renderStructuredReportV3(approvedBase, report, brandName);''', '''  const extracted = extractStructuredReportJson(result.text);
            const normalized = normalizeStructuredReportV3(extracted, definitions);
            if (normalized.warnings.length) console.warn('[Phase 6] Creative History status normalized', normalized.warnings);
            assertStructuredReportCrossPage(normalized.report);
            return renderStructuredReportV3(approvedBase, normalized.report, brandName);''')

          # 4) Bridge: explicit input modes, warnings and shared normalization.
          path = 'src/lib/installFullReportPhase6Bridge.ts'
          replace_once(path, "import { buildCreativeHistoryCompilerDirective } from './creativeHistoryContract';", "import { buildCreativeHistoryDataDirective } from './creativeHistoryContract';")
          replace_once(path, '''  buildStructuredReportPrompt,
            extractStructuredReportJson,
            prepareStructuredReportBase,
            renderStructuredReportV3,
          } from '../report/structuredReportV3';''', '''  buildStructuredReportPrompt,
            extractStructuredReportJson,
            formatStructuredNormalizationWarnings,
            normalizeStructuredReportV3,
            prepareStructuredReportBase,
            renderStructuredReportV3,
            type StructuredNormalizationWarning,
          } from '../report/structuredReportV3';''')
          replace_once(path, '''function findPhase6Textarea(): HTMLTextAreaElement | null {
            return Array.from(document.querySelectorAll<HTMLTextAreaElement>('textarea'))
              .find((textarea) => /외부|html|json/i.test(textarea.getAttribute('placeholder') || '')) || null;
          }''', '''type ManualInputMode = 'structured-json' | 'compat-html';

          function findPhase6Textarea(mode: ManualInputMode, button?: HTMLButtonElement): HTMLTextAreaElement | null {
            const local = button?.closest<HTMLElement>('[data-phase6-panel]')
              ?.querySelector<HTMLTextAreaElement>(`textarea[data-phase6-input-mode="${mode}"]`);
            if (local) return local;
            return document.querySelector<HTMLTextAreaElement>(`textarea[data-phase6-input-mode="${mode}"]`)
              || Array.from(document.querySelectorAll<HTMLTextAreaElement>('textarea'))
                .find((textarea) => /외부|html|json/i.test(textarea.getAttribute('placeholder') || ''))
              || null;
          }''')
          replace_once(path, "const originalText = normalizeText(button.textContent) || '프롬프트 추출';", "const originalText = normalizeText(button.textContent) || '외부 AI용 JSON 프롬프트 다운로드';")
          replace_once(path, '      buildCreativeHistoryCompilerDirective(rawResearch),', '      buildCreativeHistoryDataDirective(rawResearch),')
          old_compile = '''async function compileManualInput(value: string, brandName: string): Promise<string> {
            if (looksLikeStructuredJson(value)) {
              const approvedBase = await loadApprovedPilotBaseHtml(brandName);
              const report = extractStructuredReportJson(value);
              assertStructuredReportCrossPage(report);
              return renderStructuredReportV3(approvedBase, report, brandName);
            }
            if (/<!doctype\\s+html|<html\\b/i.test(value)) {
              const sanitized = sanitizeCompatibleFullReportHtml(value, brandName);
              return validateCompatibleStructure(sanitized, brandName);
            }
            throw new Error('구조화 JSON 또는 완전한 HTML 문서를 확인할 수 없다.');
          }'''
          new_compile = '''type ManualCompileResult = {
            html: string;
            warnings: StructuredNormalizationWarning[];
            inputKind: ManualInputMode;
          };

          async function compileManualInput(value: string, brandName: string, mode: ManualInputMode): Promise<ManualCompileResult> {
            if (mode === 'structured-json') {
              if (!looksLikeStructuredJson(value)) throw new Error('ProductionReportV3 JSON을 확인할 수 없습니다. JSON 전체를 붙여넣거나 .json/.txt 응답 파일을 불러오세요.');
              const approvedBase = await loadApprovedPilotBaseHtml(brandName);
              const prepared = prepareStructuredReportBase(approvedBase, brandName);
              const definitions = applyStructuredDefinitionPolicy(prepared.definitions);
              const extracted = extractStructuredReportJson(value);
              const normalized = normalizeStructuredReportV3(extracted, definitions);
              assertStructuredReportCrossPage(normalized.report);
              return {
                html: renderStructuredReportV3(approvedBase, normalized.report, brandName),
                warnings: normalized.warnings,
                inputKind: mode,
              };
            }
            if (/<!doctype\\s+html|<html\\b/i.test(value)) {
              const sanitized = sanitizeCompatibleFullReportHtml(value, brandName);
              return { html: validateCompatibleStructure(sanitized, brandName), warnings: [], inputKind: mode };
            }
            throw new Error('호환용 완성 HTML 문서를 확인할 수 없습니다.');
          }'''
          replace_once(path, old_compile, new_compile)
          replace_once(path, '''  const textarea = findPhase6Textarea();
            const brandName = readBrandName();''', '''  const mode: ManualInputMode = button.dataset.phase6Action === 'compat-html' ? 'compat-html' : 'structured-json';
