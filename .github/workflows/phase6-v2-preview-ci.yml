name: Phase 6 Color Correction Preview CI

on:
  push:
    branches:
      - fix/phase6-report-color-consistency-v1
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run production build and preserve log
        shell: bash
        run: |
          set +e
          npm run build > phase6-color-build.log 2>&1
          code=$?
          echo "$code" > phase6-color-build.exit
          tail -n 160 phase6-color-build.log
          exit 0
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase6-color-build-diagnostics
          path: |
            phase6-color-build.log
            phase6-color-build.exit
      - name: Enforce build result
        shell: bash
        run: test "$(cat phase6-color-build.exit)" = "0"
