name: Patch Winning Move Fixture

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'fix/phase6-approved-html-semantic-contract-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/phase6-approved-html-semantic-contract-v1
          fetch-depth: 0
      - run: python scripts/patch-winning-move-fixture.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/e2e-phase6-approved-html-semantic.mjs
          git commit -m "Use a concrete Winning Move fixture"
          git push origin HEAD:fix/phase6-approved-html-semantic-contract-v1
