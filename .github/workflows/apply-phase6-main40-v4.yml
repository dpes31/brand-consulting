name: Apply Phase 6 Main40 V4

on:
  push:
    branches:
      - fix/phase6-main40-semantic-renderer-v4
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]' && (github.event_name == 'push' || github.head_ref == 'fix/phase6-main40-semantic-renderer-v4')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout correction branch
        uses: actions/checkout@v4
        with:
          ref: fix/phase6-main40-semantic-renderer-v4
          fetch-depth: 0
      - name: Correct patch literal escaping
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/apply-phase6-main40-v4.py')
          s = p.read_text(encoding='utf-8')
          s = s.replace('replace_once(runtime,\n"""  const preflight', 'replace_once(runtime,\nr"""  const preflight', 1)
          s = s.replace("  const nativePrint = windowRef.__FULL_REPORT_NATIVE_PRINT__;\n\"\"\",\n\"\"\"  const preflight", "  const nativePrint = windowRef.__FULL_REPORT_NATIVE_PRINT__;\n\"\"\",\nr\"\"\"  const preflight", 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Apply deterministic correction and capture diagnostics
        shell: bash
        run: |
          set +e
          rm -f phase6-main40-apply.txt phase6-main40-apply-exit.txt
          python scripts/apply-phase6-main40-v4.py > phase6-main40-apply.txt 2>&1
          code=$?
          echo "$code" > phase6-main40-apply-exit.txt
          cat phase6-main40-apply.txt
          exit 0
      - name: Commit correction or diagnostics
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$(cat phase6-main40-apply-exit.txt)" = "0" ]; then
            rm -f scripts/apply-phase6-main40-v4.py
            rm -f .github/workflows/apply-phase6-main40-v4.yml
            rm -f phase6-main40-apply.txt phase6-main40-apply-exit.txt
            rm -f docs/PHASE6_MAIN40_V4_PR_PENDING.md docs/PHASE6_MAIN40_V4_STATUS.md docs/PHASE6_MAIN40_V4_README.md docs/PHASE6_MAIN40_V4_DRAFT_ONLY.md docs/PHASE6_MAIN40_V4_TEMP_CLEANUP.md docs/PHASE6_MAIN40_V4_FINAL_TEMP_MARKER.md
            rm -f handoff/PHASE6_MAIN40_V4_PR_NOTE.md handoff/PHASE6_MAIN40_V4_STOP_EXTRA_MARKERS.md handoff/PHASE6_MAIN40_V4_SETUP_COMPLETE.md handoff/PHASE6_MAIN40_V4_NEXT.md handoff/PHASE6_MAIN40_V4_LOCK.md
            git add -A
            git commit -m "Restore Phase 6 40-page semantic renderer contract"
          else
            git add -f phase6-main40-apply.txt phase6-main40-apply-exit.txt
            git commit -m "Record Phase 6 correction patch failure"
          fi
          git push origin HEAD:fix/phase6-main40-semantic-renderer-v4
