name: Finalize Approved HTML Handoff

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]' && github.head_ref == 'fix/phase6-approved-html-semantic-contract-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/phase6-approved-html-semantic-contract-v1
          fetch-depth: 0
      - name: Prepare audit handoff placeholders
        run: |
          mkdir -p handoff
          touch handoff/PHASE6_REAL_WORLD_QA_HANDOFF_2026-07-08.md
          touch handoff/PHASE6_EXTERNAL_AI_JSON_WORKFLOW_QA_2026-07-09.md
      - run: python scripts/finalize-approved-html-handoff.py
      - name: Commit documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add handoff/PROJECT_HANDOFF.md handoff/WORK_LOG.md handoff/DECISION_LOG.md handoff/PHASE6_REAL_WORLD_QA_HANDOFF_2026-07-08.md handoff/PHASE6_EXTERNAL_AI_JSON_WORKFLOW_QA_2026-07-09.md docs/REPORT_TEMPLATE_SPEC.md docs/PDF_EXPORT_E2E_STANDARD.md
          git commit -m "Document approved Phase 6 complete-HTML contract"
          git push origin HEAD:fix/phase6-approved-html-semantic-contract-v1
